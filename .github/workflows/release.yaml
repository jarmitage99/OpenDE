name: Release
on:
  push:
    tags: ['v*', '[0-9]*']

jobs:
  linux:
    uses: ./.github/workflows/linux.yaml
  windows:
    uses: ./.github/workflows/windows.yaml
  appimage:
    uses: ./.github/workflows/appimage.yaml
  flatpak:
    uses: ./.github/workflows/flatpak.yaml

  release:
    needs: [linux, windows, appimage, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package archives
        run: |
          tag="${GITHUB_REF_NAME}"

          chmod +x deusex-linux-ubuntu/* deusex-linux-fedora/*
          tar -czf "deusex-linux-ubuntu-${tag}.tar.gz" -C deusex-linux-ubuntu .
          tar -czf "deusex-linux-fedora-${tag}.tar.gz" -C deusex-linux-fedora .
          (cd deusex-windows-mingw && zip -r "../deusex-windows-${tag}.zip" .)
          mv deusex-appimage-x86_64/*.AppImage "deusex-${tag}-x86_64.AppImage"
          mv deusex-flatpak-x86_64/*.flatpak "deusex-${tag}.flatpak"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            deusex-linux-ubuntu-*.tar.gz
            deusex-linux-fedora-*.tar.gz
            deusex-windows-*.zip
            deusex-*-x86_64.AppImage
            deusex-*.flatpak
